function stores(){const text=q.toLocaleLowerCase().trim(),cats=activeCats();const all=list('stores').filter(s=>{const ds=distStore(s);return live(s)&&(!s.categoryId||cats.some(c=>c.id===s.categoryId))&&(!category||s.categoryId===category)&&(!s.radius||ds==null||ds<=s.radius)&&(!text||[s.name,s.activity,s.area,s.address,by('categories',s.categoryId)?.name,...shopProducts(s.id).map(p=>p.name)].join(' ').toLocaleLowerCase().includes(text))});const low=s=>{const prices=shopProducts(s.id).map(price);return prices.length?Math.min(...prices):Infinity};return all.sort((a,b)=>sort==='price'?low(a)-low(b):sort==='rating'?rating(b)-rating(a):sort==='new'?String(b.createdAt||'').localeCompare(String(a.createdAt||'')):(distStore(a)??Infinity)-(distStore(b)??Infinity))}

function shops(){return heading('المحلات',btn(ic('pin',17)+' '+esc(selected()?.name||'حدّد موقعك'),'location','','c-textbtn'))+'<div class="c-toolbar">'+searchBar()+'<select id="c-sort" aria-label="ترتيب المحلات">'+[['near','الأقرب'],['price','الأقل سعرًا'],['rating','الأعلى تقييمًا'],['new','الأحدث']].map(([v,l])=>'<option value="'+v+'" '+(sort===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="c-tags">'+[['','الكل'],...activeCats().map(c=>[c.id,c.name])].map(([id,name])=>btn(esc(name),'category',id,'c-chip '+(category===id?'on':''))).join('')+'</div><section class="c-section">'+shopCards(stores())+'</section>'}
function shop(id){const s=by('stores',id);if(!s||!live(s))return missing();const products=shopProducts(id);return heading(s.name,btn(ic('map')+' الخريطة','storemap',id,'c-textbtn'))+'<div class="c-card"><p>'+esc(s.description||s.address||'')+'</p><div class="c-foot"><span class="c-marker">'+(open(s)?'يستقبل الطلبات':'مغلق حاليًا')+'</span><span class="c-muted">الحد الأدنى '+money(s.minOrder)+'</span></div></div><section class="c-section">'+heading('منتجات المحل')+(products.length?'<div class="c-cardgrid">'+products.map(p=>{const photo=urlImg(p.image||p.images?.[0]);return '<button class="c-card-link" '+action('go','product|'+p.id)+'>'+(photo?'<img class="c-card-photo" alt="" src="'+photo+'">':'<span class="c-symbol">'+ic('bag')+'</span>')+'<div class="c-foot"><h3>'+esc(p.name)+'</h3><b>'+money(price(p))+'</b></div><p class="c-muted">'+esc(p.description||'')+'</p><div class="c-foot"><span class="c-muted">'+(p.stock>0?'متوفر':'نفدت الكمية')+'</span>'+ic('arrow',17)+'</div></button>'}).join('')+'</div>':empty('bag','لا توجد منتجات متاحة','تابع المحل بعد إضافة منتجاته.'))+'</section>'}

o.rating?'<form id="c-rate" class="c-form"><label>تقييم الطلب<select name="rating">'+[5,4,3,2,1].map(i=>'<option value="'+i+'">'+i+' ★</option>').join('')+'</select></label>'+field('comment','ملاحظات التقييم','text','','maxlength="300"')+'<button class="c-primary">إرسال التقييم</button></form>':o.rating?'<p>تقييمك '+esc(o.rating)+' / 5</p>':'')+'</div>'}

async function pickAddress(id){const old=personal.addresses?.find(a=>a.id===id);const p=await Maps.pick({point:old||selected(),title:'حدّد عنوان التوصيل'});if(!p)return;const name=await nameAddress(old?.name);if(!name)return;const addr={...p,name,id:old?.id||crypto.randomUUID(),version:old?.version};await A.run('save',{collection:'addresses',record:addr});personal.addresses=[...(personal.addresses||[]).filter(a=>a.id!==addr.id),addr];personal.selected=addr.id;await persist();A.render();A.toast('تم حفظ عنوان التوصيل')}

async function resizePhoto(f){if(!f||!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>10*1024*1024)throw Error('اختر صورة JPG أو PNG أو WebP أصغر من 10 ميغابايت.');const img=await createImageBitmap(f);const r=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();return c.toDataURL('image/jpeg',0.75)}
function validateQty(line,other=0){const p=by('products',line.productId);if(!p||!live(p)||!Number.isSafeInteger(line.qty)||line.qty<1||line.qty+other>Math.min(p.stock,p.maxQty||Infinity))throw Error('الكمية المطلوبة غير متوفرة أو تتجاوز حد الطلب.')}
async function commitOrder(form){if(!activeQuote||busy)return;readForm();const kind=currentPage==='parcel'?'parcel':'store',d=draft(kind),data=currentData(kind),{quote,route}=activeQuote;if(quote.method==='zone'&&!form.elements.zoneConsent?.checked)throw Error('وافق على تسعيرة المنطقة قبل التأكيد.');if(kind==='store'){const s=by('stores',data.storeId);if(!s||!open(s))throw Error('المحل مغلق حاليًا.');if(goods()<Number(s.minOrder||0))throw Error('قيمة المنتجات أقل من الحد الأدنى للمحل.')}const {attempt,signature,attemptAt,...clean}=data;const payload={...clean,acceptZone:quote.method==='zone',expectedFee:quote.fee};const sig=JSON.stringify(payload);if(d.signature!==sig){d.signature=sig;d.attempt=crypto.randomUUID();d.attemptAt=new Date().toISOString()}delete payload.attemptAt;busy=true;form.querySelector('#c-confirm').disabled=true;try{await persist();const id=d.attempt;await A.run('order.create',payload,{id,at:d.attemptAt,roadKm:route.roadKm});delete personal.draft[draftKey(kind)];if(kind==='store')personal.cart=[];await persist();A.go('track',id);void offerOrderShare(id);A.toast(A.central?'حُفظ طلبك على الجهاز، تابع اعتماد الخادم من صفحة المزامنة':'تم حفظ طلبك على هذا الجهاز')}finally{busy=false;if(form.isConnected)form.querySelector('#c-confirm').disabled=false}}
async function handleSubmit(e){const f=e.target;if(!f.id?.startsWith('c-'))return;e.preventDefault();const fd=new FormData(f);switch(f.id){
case 'c-search':q=String(fd.get('q')||'');A.go('shops');if(currentPage==='shops')A.render();break;
case 'c-profile':personal.senderName=String(fd.get('senderName')).trim();personal.phone=String(fd.get('phone')).trim();await persist();A.toast('تم حفظ بيانات التواصل');break;
case 'c-product':{const p=by('products',currentId),cart=personal.cart;if(cart.length&&by('products',cart[0].productId)?.storeId!==p.storeId)throw Error('أكمل طلب المتجر الحالي أو أفرغ السلة قبل الطلب من متجر آخر.');const line={productId:p.id,qty:Number(fd.get('qty')),option:String(fd.get('option')||'')};validateQty(line,cart.filter(l=>l.productId===p.id).reduce((v,l)=>v+l.qty,0));const existing=cart.find(l=>l.productId===p.id&&l.option===line.option);if(existing)existing.qty+=line.qty;else cart.push(line);await persist();A.toast('أضيف المنتج إلى السلة');A.go('cart');break}

async function handleClick(e){const b=e.target.closest('[data-ca]');if(!b)return;const act=b.dataset.ca,v=b.dataset.val;switch(act){
case 'go':{const [pg,id]=v.split('|');if(pg==='shops'&&currentPage!=='shops'){category='';q=''}A.go(pg,id||'');break}
case 'workspace':A.workspace();break;
case 'category':category=v;q='';if(currentPage==='shops')A.render();else A.go('shops');break;
case 'location':case 'editaddr':await pickAddress(v);break;
case 'selectaddr':personal.selected=v;await persist();A.render();break;
case 'deladdr':if(!confirm('حذف هذا العنوان المحفوظ؟'))return;{const addr=A.state.addresses.find(x=>x.id===v);if(addr)await A.run('delete',{collection:'addresses',id:v,version:addr.version})}personal.addresses=personal.addresses.filter(p=>p.id!==v);if(personal.selected===v)personal.selected=personal.addresses[0]?.id||'';await persist();A.render();break;
case 'qty':case 'remove':{const [i,change]=v.split(':').map(Number),l=personal.cart[i];if(!l)return;const next=l.qty+change;if(act==='remove'||next<1){personal.cart.splice(i,1)}else{validateQty({...l,qty:next},personal.cart.filter((p,idx)=>idx!==i&&p.productId===l.productId).reduce((x,p)=>x+p.qty,0));l.qty=next}await persist();A.render();break}

case 'sharewa':return shareOrder(v);
case 'ordermap':{const o=orderList().find(o=>o.id===v);if(!o)return;const route=await Maps.route(o.pickup,o.dropoff);Maps.show({title:'خريطة الطلب',points:[{...o.pickup,label:'الاستلام'},{...o.dropoff,label:'التسليم'}],route:route.points});break}
case 'cancel':{const o=orderList().find(o=>o.id===v);if(!o||!confirm('إلغاء هذا الطلب؟'))return;await A.run('order.status',{id:o.id,version:o.version,status:'cancelled',reason:'طلب الزبون الإلغاء'});A.render();break}
case 'reorder':{const o=orderList().find(o=>o.id===v);if(!o)return;if(o.kind==='parcel'){personal.draft.parcel={pickup:o.pickup,dropoff:o.dropoff,recipientName:o.recipientName,recipientPhone:o.recipientPhone,senderName:o.senderName,senderPhone:o.senderPhone,description:o.description,itemType:o.itemType,notes:o.notes};await persist();A.go('parcel')}else{if(personal.cart.length&&!confirm('استبدال السلة الحالية بمنتجات الطلب السابق؟'))return;const rows=o.items.map(l=>({productId:l.productId,qty:l.qty,option:l.option||''}));for(const l of rows)validateQty(l,rows.filter(r=>r!==l&&r.productId===l.productId).reduce((t,r)=>t+r.qty,0));personal.cart=rows;await persist();A.go('cart')}break}}}
async function discoverRoads(){const addr=selected();if(!addr||!['home','shops'].includes(currentPage))return;const run=++searchRun,shops=list('stores').filter(live),queue=shops.filter(s=>!routeCache.has(pointKey(s,addr)));if(!queue.length)return;let changed=false;for(let i=0;i<queue.length;i+=3){if(run!==searchRun)return;await Promise.all(queue.slice(i,i+3).map(async s=>{try{const route=await Maps.route(s,addr);routeCache.set(pointKey(s,addr),route);if(route?.roadKm!=null)changed=true}catch{}}))}if(changed&&run===searchRun&&['home','shops'].includes(currentPage))A.render()}

return {routes,render,bind,location:()=>pickAddress().catch(err=>A.toast(err.message)),currentAddress:()=>selected(),cartCount:()=>(personal.cart||[]).reduce((a,b)=>a+b.qty,0)};

</script><script>const Admin = (() => {
  const safe = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const cash = value => Number(value || 0).toLocaleString('ar-PS',{maximumFractionDigits:2})+' ₪';
  const date = value => value ? new Date(value).toLocaleDateString('ar-PS') : '—';

async function startCentral(actor){document.body.classList.remove('signedout');await switchUser(actor,true);await sync(true)}
async function logout(){Maps.stop();try{await post('/api/logout',{});await clearDeviceCode('verified-admin');await clearDeviceCode('device-code-company');localStorage.removeItem('dp-last-actor');sessionStorage.removeItem('dp-central-user');history.replaceState(null,'',location.pathname);live=false;auth()}catch(e){announce(e.message)}}
function transientError(msg){Q('#app').innerHTML='<div class="shell-panel"><h2>تعذر فتح التطبيق</h2><p>'+esc(msg)+'</p><button class="primary" data-global="reload">إعادة المحاولة</button></div>'}
async function boot(){try{db=await openDatabase();if(typeof BroadcastChannel!=='undefined'){channel=new BroadcastChannel('delivery-pro-update-v1');channel.onmessage=async e=>{if(e.data?.key!==scope||!scope)return;const key=scope;const fresh=await access(key);if(key!==scope)return;box=fresh;applyView();chromeUI();if(!document.activeElement?.matches('input,textarea,select')&&!Q('dialog[open]')&&!['checkout','parcel'].includes(page))render()}}
 let central=false;let config={};const last=JSON.parse(localStorage.getItem('dp-last-actor')||'null');const saved=last&&last.until>Date.now()?last.actor:null;
 if(/^https?:$/.test(location.protocol)){try{const resp=await fetch('/api/config',{cache:'no-store',signal:AbortSignal.timeout(4500)});if(resp.ok&&resp.headers.get('content-type')?.includes('json'))config=await resp.json();central=!!config.central;if(central)localStorage.setItem('dp-server-origin','1')}catch{}if(localStorage.getItem('dp-server-origin')==='1')central=true}
 Maps.configure?.({central,routing:!!config.routing,geocoding:!!config.geocoding,mapPacks:config.mapPacks});
 if(central){if(!document.querySelector('link[rel=manifest]')){const link=document.createElement('link');link.rel='manifest';link.href='/manifest.webmanifest';document.head.append(link)}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});try{const r=await request('/api/session');await startCentral(r.actor)}catch(e){if(saved&&e.network&&saved.role!=='admin'){const expiry=last.until;await switchUser(saved,true);localStorage.setItem('dp-last-actor',JSON.stringify({actor:saved,until:expiry}));announce('تعمل الآن من النسخة المحفوظة على هذا الجهاز')}else{localStorage.removeItem('dp-last-actor');sessionStorage.removeItem('dp-central-user');auth()}}}
 else{scope='local';box=await access(scope);A.user=JSON.parse(sessionStorage.getItem('dp-local-user')||'null')||localCustomer;applyView();readRoute();if(approvalOpen)page='approval';else if(!location.hash||page==='home'&&A.user.role!=='customer')page=A.user.role==='customer'?'home':adminStart(A.user.role);render()}
 }catch(e){transientError(e.message||'تعذر الوصول إلى التخزين المحلي. افتح الملف في المتصفح.')}}
function perform(name){if(name==='manager-code')return codeForm(false);if(name==='switch-manager')return codeForm(false);if(name==='approve-now')return approveNow(document.querySelector('[data-global=approve-now]'));if(name==='retry-approval')return fetchApproval();if(name==='reload')return location.reload();if(!A.state)return;if(name==='menu')return menu();if(name==='workspace')return workspace();if(name==='location')return A.user.role==='customer'?Customer.location():workspace();if(name==='maps')return Maps.manage();if(name==='sync')return sync(true);if(name==='logout')return logout();if(name==='search'){go(A.user.role==='customer'?'shops':'adm-orders');setTimeout(()=>Q('#app input[type=search],#app input')?.focus(),50)}}
document.addEventListener('click',e=>{const d=e.target.closest('[data-page],[data-role],[data-identity],[data-global],[data-review],[data-discard]');if(!d)return;if(d.dataset.page){if(d.dataset.page==='menu')menu();else go(d.dataset.page)}else if(d.dataset.role)localRole(d.dataset.role).catch(e=>announce(e.message));else if(d.dataset.identity)switchUser({id:d.dataset.identity,company:'local',role:d.dataset.identityRole,name:d.textContent},false).catch(e=>announce(e.message));else if(d.dataset.global)perform(d.dataset.global);else if(d.dataset.review)review(d.dataset.review,false);else if(d.dataset.discard&&confirm('هل تسحب هذه العملية من قائمة الإرسال وتحفظها في سجل المراجعة؟'))review(d.dataset.discard,true)});
Q('#close-sheet').onclick=dismiss;Q('#sheet').addEventListener('close',()=>{if(sheetFocus?.isConnected)sheetFocus.focus()});
window.addEventListener('popstate',()=>{dismiss();readRoute();render()});window.addEventListener('online',()=>sync(true));window.addEventListener('offline',()=>{live=false;chromeUI()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&A.central)sync()});setInterval(()=>{if(!document.hidden&&A.central&&A.user)sync()},30000);document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.ctrlKey&&!e.altKey&&!Q('dialog[open]')&&!e.target.matches('input,textarea,select')){e.preventDefault();perform('search')}});

boot();
